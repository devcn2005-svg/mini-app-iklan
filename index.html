<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ton Earns</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram.cc.js"></script>
</head>
<body style="background-color: #1e1e1e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif;">
    <button id="btn" style="padding: 15px 30px; font-size: 18px; background-color: #0088cc; color: white; border: none; border-radius: 8px; cursor: pointer;">Tonton Iklan Sekarang</button>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const adController = window.Adsgram.init({ blockId: "52616" });

        document.getElementById("btn").addEventListener("click", async () => {
            try {
                const result = await adController.show();
                alert("Iklan selesai ditonton!");
            } catch (err) {
                alert("Iklan gagal dimuat atau ditutup.");
            }
        });
    </script>
</body>
</html>
