<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ton Earns</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background: #1e1e1e; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;">

    <button id="adBtn" onclick="tontonIklan()" style="padding: 18px 32px; font-size: 18px; background: #0088cc; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">
        Tonton Iklan Sekarang
    </button>
    <p id="status" style="margin-top: 15px; color: #888; font-size: 14px;"></p>

    <!-- Memuat skrip Adsgram secara dinamis dengan penanganan error -->
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        let adController = null;
        const statusText = document.getElementById("status");

        // Muat skrip Adsgram secara otomatis
        const script = document.createElement('script');
        script.src = "https://sad.adsgram.ai/js/adsgram.cc.js";
        script.onload = function() {
            try {
                adController = window.Adsgram.init({ blockId: "52857" });
                statusText.innerText = "Iklan siap ditonton!";
            } catch (e) {
                statusText.innerText = "Gagal inisialisasi Adsgram: " + e.message;
            }
        };
        script.onerror = function() {
            statusText.innerText = "Skrip Adsgram gagal dimuat (Cek blokir iklan/jaringan).";
        };
        document.head.appendChild(script);

        async function tontonIklan() {
            if (!adController) {
                alert("Iklan belum siap atau gagal dimuat oleh sistem.");
                return;
            }

            try {
                statusText.innerText = "Memutar iklan...";
                const result = await adController.show();
                statusText.innerText = "Iklan selesai!";
                alert("Berhasil! Iklan selesai ditonton.");
            } catch (err) {
                statusText.innerText = "Iklan ditutup atau gagal.";
                alert("Iklan gagal ditampilkan: " + JSON.stringify(err));
            }
        }
    </script>
</body>
</html>
