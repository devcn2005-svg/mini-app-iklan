<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ton Earns</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body style="background: #1e1e1e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;">

    <button id="adBtn" onclick="watchAd()" style="padding: 18px 32px; font-size: 18px; background: #0088cc; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">
        Watch Ad Now
    </button>

    <script>
        let adController = null;
        
        const myBlockId = "52850"; 

        window.onload = function () {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            if (window.Adsgram) {
                adController = window.Adsgram.init({ blockId: myBlockId });
            }
        };

        function watchAd() {
            if (!adController) {
                if (window.Adsgram) {
                    adController = window.Adsgram.init({ blockId: myBlockId });
                } else {
                    alert("Adsgram script not ready, please wait and try again.");
                    return;
                }
            }

            const btn = document.getElementById("adBtn");
            btn.innerText = "Loading Ad...";

            adController.show().then((result) => {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.sendData("claim_10_coins");
                }
            }).catch((err) => {
                btn.innerText = "Watch Ad Now";
                alert("Ad was closed or failed to load.");
            });
        }
    </script>
</body>
</html>
