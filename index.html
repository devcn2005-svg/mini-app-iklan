<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ton Earns</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- INI LINK SKRIP ADSGRAM YANG BENAR -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body style="background: #1e1e1e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;">

    <button id="adBtn" onclick="tontonIklan()" style="padding: 18px 32px; font-size: 18px; background: #0088cc; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">
        Tonton Iklan Sekarang
    </button>

    <script>
        let adController = null;

        window.onload = function () {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }

            // Inisialisasi controller Adsgram saat halaman dibuka
            if (window.Adsgram) {
                adController = window.Adsgram.init({ blockId: "52857" });
            }
        };

        function tontonIklan() {
            if (!adController) {
                if (window.Adsgram) {
                    adController = window.Adsgram.init({ blockId: "52857" });
                } else {
                    alert("Skrip Adsgram belum siap, tunggu sebentar lalu klik lagi.");
                    return;
                }
            }

            const btn = document.getElementById("adBtn");
            btn.innerText = "Memuat Iklan...";

            adController.show().then((result) => {
                btn.innerText = "Tonton Iklan Sekarang";
                alert("Berhasil! Iklan selesai ditonton.");
            }).catch((err) => {
                btn.innerText = "Tonton Iklan Sekarang";
                alert("Iklan gagal dimuat atau ditutup.");
            });
        }
    </script>
</body>
</html>
